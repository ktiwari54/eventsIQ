name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventiq
          POSTGRES_PASSWORD: eventiq
          POSTGRES_DB: eventiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventiq"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://eventiq:eventiq@localhost:5432/eventiq_test
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      # Push schema directly to the test DB (skips migration history for CI speed).
      - run: npx prisma db push --schema=prisma/schema.prisma --skip-generate
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace=apps/web || true
